<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Management System</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0e6d6; /* Pastel Beige */
      color: #6f6f6f; /* Medium-dark grey for text */
      font-family: 'Arial', sans-serif;
    }

    .navbar {
      background-color: #fffaf6;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px; /* Add space between navbar and content */
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.8rem;
      color: #ffffff; /* White for text to contrast with the teal background */
    }

    .btn-outline-primary {
      color: #ff6b6b; /* Coral Pink */
      border-color: #ff6b6b;
    }

    .btn-outline-primary:hover {
      background-color: #ff6b6b;
      color: white;
    }

    .btn-outline-secondary {
      color: #80c7b2; /* Muted Teal */
      border-color: #80c7b2;
    }

    .btn-outline-secondary:hover {
      background-color: #80c7b2;
      color: white;
    }

    .btn-success {
      background-color: #ff6b6b; /* Coral Pink */
      border: none;
    }

    .btn-success:hover {
      background-color: #e55b5b; /* Darker Coral Pink */
    }

    .card {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .rounded-circle {
      width: 70px;
      height: 70px;
      object-fit: cover;
    }

    .pagination .page-item.active .page-link {
      background-color: #ff6b6b; /* Coral Pink */
      border-color: #ff6b6b;
    }

    .pagination .page-link {
      color: #6f6f6f;
      border-color: #f0e6d6;
    }

    /* Metric Card Styling */
    .metric-card {
      background-color: #ffecd1; /* Pastel Peach */
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .metric-card h5 {
      font-weight: bold;
    }

    .metric-card p {
      font-size: 1.5rem;
      color: #ff6b6b;
    }

    /* Add spacing for top content */
    .container.my-4 {
      margin-top: 20px;
    }

    /* Add space between cards */
    .metric-cards {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
<div class="container my-4">

  <!-- Navbar Header -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" href="/">📚 Book Management System</a>
    <div class="ml-auto d-flex flex-wrap align-items-center">
      <form th:action="@{/search}" method="get" class="form-inline mr-3">
        <input type="text" name="keyword" th:value="${searchKeyword}" class="form-control mr-2"
               placeholder="Search by title or author" required>
        <button type="submit" class="btn btn-outline-primary mr-2">
          <i class="fa fa-search"></i> Search
        </button>
        <a th:href="@{/}" class="btn btn-outline-secondary">
          <i class="fa fa-undo"></i> Reset
        </a>
      </form>
      <a href="/add" class="btn btn-success">
        <i class="fa fa-plus"></i> Add Book
      </a>
    </div>
  </nav>


  <!-- No Books Message -->
  <div th:if="${(booksPage == null and #lists.isEmpty(books)) or (booksPage != null and booksPage.totalElements == 0)}"
       class="alert alert-warning text-center">
    <span class="alert-text">No books found. Add one!</span>
  </div>

  <!-- Book Grid -->
  <div class="row">
    <div class="col-md-6 col-xl-3 mb-4"
         th:each="book : ${booksPage != null ? booksPage.content : books}">
      <div class="card text-center">
        <div class="card-body">
          <img src="https://static.vecteezy.com/system/resources/previews/014/415/631/non_2x/book-learning-icon-flat-style-vector.jpg"
               alt="Cover" class="rounded-circle mb-3">
          <h5 class="card-title" th:text="${book.title}">Book Title</h5>
          <p class="card-text font-italic" th:text="${book.author}">Author</p>
          <p class="text-muted mb-1" th:text="${book.genre}">Genre</p>
          <p class="text-muted small" th:text="${book.year}">Year</p>

          <div class="btn-group btn-group-sm mt-2" role="group">
            <a th:href="@{'/book/' + ${book.id}}" class="btn btn-primary">
              <i class="fa fa-book"></i> Details
            </a>
            <a th:href="@{'/edit/' + ${book.id}}" class="btn btn-warning text-white">
              <i class="fa fa-pencil"></i> Edit
            </a>
            <a th:href="@{'/delete/' + ${book.id}}" class="btn btn-danger">
              <i class="fa fa-trash"></i> Delete
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div th:if="${booksPage != null}" class="d-flex justify-content-center mt-4">
    <nav>
      <ul class="pagination">
        <!-- Previous Page -->
        <li th:classappend="${booksPage.first} ? 'disabled'" class="page-item">
          <a class="page-link"
             th:if="${isSearch}"
             th:href="@{'/search'(keyword=${searchKeyword}, page=${currentPage - 1})}">«</a>
          <a class="page-link"
             th:unless="${isSearch}"
             th:href="@{'/'(page=${currentPage - 1})}">«</a>
        </li>

        <!-- Page Info -->
        <li class="page-item disabled">
          <a class="page-link"
             th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${booksPage.totalPages}"></a>
        </li>

        <!-- Next Page -->
        <li th:classappend="${booksPage.last} ? 'disabled'" class="page-item">
          <a class="page-link"
             th:if="${isSearch}"
             th:href="@{'/search'(keyword=${searchKeyword}, page=${currentPage + 1})}">»</a>
          <a class="page-link"
             th:unless="${isSearch}"
             th:href="@{'/'(page=${currentPage + 1})}">»</a>
        </li>
      </ul>
    </nav>
  </div>

</div>

<!-- JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
