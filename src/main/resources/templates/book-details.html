<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book Details</title>
    <!-- Bootstrap + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0e6d6; /* Pastel Beige */
            color: #6f6f6f; /* Medium-dark grey */
            font-family: 'Arial', sans-serif;
        }

        .container {
            max-width: 800px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .rounded-circle {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        .btn-success {
            background-color: #ff6b6b; /* Coral Pink */
            border: none;
        }

        .btn-success:hover {
            background-color: #e55b5b; /* Darker Coral Pink */
        }

        .btn-warning {
            background-color: #f5a623; /* Warm Yellow */
            border: none;
        }

        .btn-warning:hover {
            background-color: #e08e20; /* Darker Yellow */
        }

        .form-control {
            border-radius: 20px;
            padding: 0.8rem 1.2rem;
            border-color: #ff6b6b; /* Coral Pink */
        }

        .form-control:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 5px rgba(255, 107, 107, 0.5);
        }

        .alert-success {
            background-color: #80c7b2; /* Muted Teal */
            color: white;
            font-weight: bold;
        }

        .form-group label {
            font-weight: bold;
        }

        .pagination .page-item.active .page-link {
            background-color: #ff6b6b; /* Coral Pink */
            border-color: #ff6b6b;
        }

        .pagination .page-link {
            color: #6f6f6f;
            border-color: #f0e6d6;
        }

        .comment-list {
            padding: 10px;
        }

        .comment-list .list-group-item {
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="text-center mb-4">
        <h1 th:text="${book.title}">Book Title</h1>
        <p class="text-muted" th:text="${book.genre} + ' | ' + ${book.year}"></p>
    </div>



    <!-- Book Info Card -->
    <div class="card mb-4 p-4">
        <h5><i class="fa fa-user"></i> Author:</h5>
        <p th:text="${book.author}"></p>

        <h5><i class="fa fa-star"></i> Average Rating:</h5>
        <p th:text="${#numbers.formatDecimal(book.averageRating, 1, 2)}">0</p>
    </div>

    <!-- Rating Form -->
    <div class="card mb-4 p-4 shadow-sm">
        <!-- Description Section -->
        <div class="card-body">
            <h4 class="card-title"><i class="fa fa-book"></i> Description</h4>
            <p class="card-text" th:text="${book.description != null && !#strings.isEmpty(book.description) ? book.description : 'No description provided.'}"></p>
        </div>

        <!-- Rating Section -->
        <div class="card-body mt-4">
            <h4 class="card-title"><i class="fa fa-star"></i> Rate This Book</h4>
            <form th:action="@{'/rate/' + ${book.id}}" method="post" class="form-inline mt-2">
                <label class="mr-2" for="rating">Rating (1-5):</label>
                <input type="number" name="rating" id="rating" min="1" max="5" class="form-control mr-2" required />
                <button type="submit" class="btn btn-warning">Submit</button>
            </form>
        </div>
    </div>




    <!-- Comment Form -->
    <div class="card mb-4 p-4">
        <h4>➕ Add a Comment</h4>
        <form th:action="@{'/comment/' + ${book.id}}" th:object="${comment}" method="post">
            <div class="form-group">
                <label for="nickname"><i class="fa fa-user"></i> Nickname</label>
                <input type="text" id="nickname" th:field="*{nickname}" class="form-control" required minlength="2">
            </div>
            <div class="form-group">
                <label for="message"><i class="fa fa-comment"></i> Message</label>
                <input type="text" id="message" th:field="*{message}" class="form-control" required minlength="2">
            </div>
            <button type="submit" class="btn btn-success">💬 Submit Comment</button>
        </form>
    </div>

    <!-- Comments List -->
    <div class="card mb-4 p-4">
        <h4>💬 Comments</h4>
        <div class="comment-list">
            <ul class="list-group list-group-flush mt-3" th:if="${not #lists.isEmpty(book.comments)}">
                <li class="list-group-item" th:each="comment : ${book.comments}">
                    <strong th:text="${comment.nickname}"></strong>:
                    <span th:text="${comment.message}"></span>
                </li>
            </ul>
            <p th:if="${#lists.isEmpty(book.comments)}" class="text-muted">No comments yet.</p>
        </div>
    </div>

    <!-- Back Button -->
    <a href="/" class="btn btn-link">⬅ Back to Home</a>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
